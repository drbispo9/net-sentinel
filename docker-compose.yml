# Stack completo do NetSentinel: backend (FastAPI + frontend) + PostgreSQL.
#
# Subir tudo:  docker compose up -d --build
# Logs:        docker compose logs -f backend
# Derrubar:    docker compose down            (mantém os dados no volume)
# Zerar:       docker compose down -v         (APAGA o volume e os dados)
#
# Acesse a aplicação em:  http://localhost:8000
#
# Pré-requisito: um arquivo .env no mesmo diretório (copie de .env.example) com,
# no mínimo, POSTGRES_PASSWORD definido. As credenciais do banco são lidas de lá.

services:
  postgres:
    image: postgres:16-alpine
    container_name: netsentinel-postgres
    restart: unless-stopped
    environment:
      # Lidos do arquivo .env (mesmo diretório). NÃO versionar a senha aqui.
      # O `:?` faz o compose falhar com mensagem clara se a variável faltar.
      POSTGRES_USER: ${POSTGRES_USER:-netsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-netsentinel}
      # Locale/encoding consistentes para acentuação (pt-BR).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - netsentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsentinel -d netsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: netsentinel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # só sobe quando o banco aceita conexões
    env_file:
      - .env                          # API_KEY, CORS_ORIGINS, PORTAL_OAB_*, etc.
    environment:
      # Dentro da rede do compose o banco é acessível pelo NOME do serviço
      # ("postgres"), não por "localhost". Sobrescreve o DATABASE_URL do .env
      # (que aponta para localhost, usado quando se roda o backend no host).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netsentinel}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-netsentinel}
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW                       # necessário p/ o `ping` (ICMP) do monitor de hardware
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  netsentinel_pgdata:
